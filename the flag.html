<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Flag</title>
    <style>
        .flag{
            width: 300px;
            height: 180px;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
        }
        .saffron{
            width: 100%;
            height: 60px;
            background-color: #FF7722
        }
        .white{
            width: 100%;
            height: 60px;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .green{
            width: 100%;
            height: 60px;
            background-color: green;
        }
        .chakra {
    width: 42px;
    height: 42px;
    border: 2px solid navy;
    border-radius: 50%;

    background:
    repeating-conic-gradient(
        navy 0deg 1.5deg,
        transparent 1.5deg 15deg
    );

    /* position: relative; */
}

.chakra::after {
    content: "";
    width: 5px;
    height: 5px;
    background-color: navy;
    border-radius: 50%;

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
    </style>
</head>
<body>
    <div class="flag">
        <div class="saffron"></div>
        <div class="white">
            <div class="chakra"></div>
        </div>
        <div class="green"></div>

    </div>
    
</body>
</html>
